services:
  massdb-be:
    image: ${MASSDB_IMAGE:-massdb-sql:2.0.5}
    platform: linux/arm64
    container_name: massdb-be
    network_mode: host
    restart: unless-stopped
    environment:
      SERVICE_ROLE: be
      FE_HOST: ${FE_HOST:?Set FE_HOST to the FE server address}
      BE_IP: ${BE_IP:?Set BE_IP to this BE server address}
      PRIORITY_NETWORKS: ${PRIORITY_NETWORKS:-}
    volumes:
      - ./conf/be:/opt/massdb-config/be:ro
      - ${DATA_ROOT:-./data}/be/storage:/opt/apache-doris/be/storage
      - ${DATA_ROOT:-./data}/be/log:/opt/apache-doris/be/log
