#####################################################################
## The uppercase properties are read and exported by bin/start_fe.sh.
## To see all Frontend configurations,
## see fe/src/org/apache/doris/common/Config.java
#####################################################################

CUR_DATE=`date +%Y%m%d-%H%M%S`

# Log dir
LOG_DIR = ${DORIS_HOME}/log

# For jdk 17, this JAVA_OPTS will be used as default JVM options
JAVA_OPTS_FOR_JDK_17="-Dfile.encoding=UTF-8 -Djavax.security.auth.useSubjectCredsOnly=false -Xmx8192m -Xms8192m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=$LOG_DIR -Xlog:gc*,classhisto*=trace:$LOG_DIR/fe.gc.log.$CUR_DATE:time,uptime:filecount=10,filesize=50M -Darrow.enable_null_check_for_get=false --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.nio.cs=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.management/sun.management=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.xml/com.sun.org.apache.xerces.internal.jaxp=ALL-UNNAMED"

# Set your own JAVA_HOME
# JAVA_HOME=/path/to/jdk/

##
## the lowercase properties are read by main program.
##

# store metadata, must be created before start FE.
# Default value is ${DORIS_HOME}/doris-meta
# meta_dir = ${DORIS_HOME}/doris-meta

# MassDB License remains disabled for legacy clusters unless both immutable settings are present.
# The absolute root trust directory contains only <kid>.pem P-256 public keys. Its directory and
# files must have the same owner and must not be writable by group or other users.
# massdb_license_root_trust_dir = /etc/massdb/license/root-trust
# massdb_license_max_term_seconds = 31536000
# FE internal role traffic reuses the HTTPS listener. Production client and Jetty server identity
# read the same signed active generation from the component-native identity store and a 0400/0600
# startup-secret file; the secret value is never placed in fe.conf. If that generation is missing,
# expired, corrupt, rolled back, or cannot be reloaded, Jetty restores the original ordinary HTTPS
# context and only the internal role path becomes unavailable; FE startup and ingestion remain
# independent. Before enabling this feature, issue the identity leaf with every DNS/IP SAN used by
# HTTPS clients and deploy the Identity CA trust chain to those clients. The disk key stores below
# are development-test only and require both debug switches.
# massdb_license_role_mtls_enabled = true
# The component-native management API remains disabled unless root trust and role mTLS are both
# configured. Bootstrap remains mTLS-only and opens once only when a pre-start component-local
# marker proves a fresh meta_dir; the marker path must be absolute and is never regenerated by FE.
# massdb_license_management_api_enabled = true
# massdb_license_bootstrap_marker_file = /var/lib/massdb-sql/doris-meta/bootstrap-control.marker
# Existing clusters use a separate local marker on every persisted FE. Bootstrap and upgrade
# markers are mutually exclusive. Creating the file never writes catalog state; OBSERVE is written
# only after the ready Leader directly obtains an exact mTLS build attestation from every FE.
# massdb_license_upgrade_marker_file = /var/lib/massdb-sql/doris-meta/license-upgrade.marker
# massdb_license_operation_ack_deadline_seconds = 900
# massdb_license_identity_store_dir = /var/lib/massdb-sql/license-identity
# massdb_license_identity_artifact_root_dir = /etc/massdb/license/identity-artifact-roots
# massdb_license_identity_secret_file = /run/credentials/massdb-sql/license-identity-secret
# enable_debug_points = true
# massdb_license_role_mtls_development_keystore_enabled = true
# massdb_license_role_mtls_trust_store_path = /etc/massdb/license/role-ca.p12
# massdb_license_role_mtls_trust_store_password = ${MASSDB_LICENSE_ROLE_TRUST_STORE_PASSWORD}
# massdb_license_role_mtls_trust_store_type = PKCS12
# massdb_license_role_mtls_key_store_path = /etc/massdb/license/fe-role.p12
# massdb_license_role_mtls_key_store_password = ${MASSDB_LICENSE_ROLE_KEY_STORE_PASSWORD}
# massdb_license_role_mtls_key_store_type = PKCS12
# massdb_license_role_exchange_interval_ms = 1000
# massdb_license_role_request_timeout_ms = 5000

# Default dirs to put jdbc drivers,default value is ${DORIS_HOME}/jdbc_drivers
# jdbc_drivers_dir = ${DORIS_HOME}/jdbc_drivers

http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
arrow_flight_sql_port = 8070

# Choose one if there are more than one ip except loopback address. 
# Note that there should at most one ip match this list.
# If no ip match this rule, will choose one randomly.
# use CIDR format, e.g. 10.10.10.0/24 or IP format, e.g. 10.10.10.1
# Default value is empty.
# priority_networks = 10.10.10.0/24;192.168.0.0/16

# Advanced configurations 
# log_roll_size_mb = 1024
# INFO, WARN, ERROR, FATAL
sys_log_level = INFO
# NORMAL, BRIEF, ASYNC
sys_log_mode = ASYNC
